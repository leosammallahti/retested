[project]
name = "retested-pipeline"
version = "0.1.0"
description = "Builds the Retested site bundle from FORRT's open replication data."
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "rapidfuzz>=3.9",
  "pyyaml>=6.0",
  "pypdf>=6.0",       # pure-Python; `fulltext --pdf` only
]

[project.optional-dependencies]
matching = [
  "fastembed>=0.8,<0.9",
]

[tool.ruff]
line-length = 140

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]
